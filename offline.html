<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión | ItsWatuyusei Bakery</title>
  <meta name="theme-color" content="#ff6a00">
  <link rel="icon" type="image/x-icon" href="https://itswatuyusei.github.io/favicon.ico">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1.5rem;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255, 106, 0, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(238, 9, 121, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .icon {
      font-size: 4.5rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(255, 106, 0, 0.4));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ff6a00, #ee0979);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 1rem;
      color: #aaa;
      max-width: 320px;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #ff6a00, #ee0979);
      color: white;
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(255, 106, 0, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255, 106, 0, 0.5);
    }

    .status {
      font-size: 0.78rem;
      color: #555;
      margin-top: 1rem;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      margin-right: 0.4rem;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="icon">🥐</div>
  <h1>Sin conexión</h1>
  <p>Parece que no tienes acceso a internet. Revisa tu conexión e intenta de nuevo.</p>
  <a class="btn" href="./index.html">↺ Reintentar</a>
  <p class="status"><span class="dot"></span>Esperando conexión...</p>

  <script>
    window.addEventListener('online', () => {
      window.location.href = './index.html';
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.keyCode === 123) e.preventDefault();
    });
  </script>
</body>
</html>
